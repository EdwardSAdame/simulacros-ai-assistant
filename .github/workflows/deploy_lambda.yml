name: 🚀 Deploy Roma Chatbot Functions to AWS

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/deploy_lambda.yml"

jobs:
  deploy:
    name: Deploy Roma Lambda Functions
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Install Dependencies & Package Lambda
        run: |
          mkdir -p package

          pip install --platform manylinux2014_x86_64 \
                      --target package/ \
                      --implementation cp \
                      --python-version 3.11 \
                      --only-binary=:all: \
                      --upgrade -r requirements.txt

          # Copy the src directory (contains storage, services, utils, etc.)
          cp -r src package/src

          # Copy ALL Lambda entrypoint files to the root of the package
          cp src/lambda_chat_handler.py package/
          cp src/lambda_ai_worker_handler.py package/
          cp src/lambda_dlq_reprocessor.py package/
          cp src/lambda_feedback_handler.py package/
          cp src/lambda_ws_connect_handler.py package/
          cp src/lambda_ws_disconnect_handler.py package/
          cp src/lambda_get_conversations_handler.py package/
          cp src/lambda_get_messages_handler.py package/
          
          # --- ADDED: Copy new WsAudio handlers ---
          cp src/lambda_audio_connect_handler.py package/
          cp src/lambda_audio_disconnect_handler.py package/
          cp src/lambda_audio_token_handler.py package/
          # --- ---

          # Zip the contents of the package directory
          cd package
          zip -r ../deployment.zip . -x "**/__pycache__/*" "*.git*"

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy RomaChatHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_ROMA_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy RomaAIWorkerHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_AI_WORKER_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy RomaDLQReprocessor
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_ROMA_DLQ_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy FeedBackHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FEEDBACK_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy RomaWSOnConnectHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_WS_CONNECT_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy RomaWSOnDisconnectHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_WS_DISCONNECT_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy GetConversationsHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_GET_CONVERSATIONS_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      - name: 🚀 Deploy GetMessagesHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_GET_MESSAGES_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}

      # --- ADDED: Deploy step for WsAudioOnConnectHandler ---
      - name: 🚀 Deploy WsAudioOnConnectHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_AUDIO_CONNECT_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}
      # --- ---

      # --- ADDED: Deploy step for WsAudioOnDisconnectHandler ---
      - name: 🚀 Deploy WsAudioOnDisconnectHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_AUDIO_DISCONNECT_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}
      # --- ---
      
      # --- ADDED: Deploy step for WsAudioTokenHandler ---
      - name: 🚀 Deploy WsAudioTokenHandler
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_AUDIO_TOKEN_HANDLER_NAME }} \
            --zip-file fileb://deployment.zip \
            --region ${{ vars.AWS_REGION }}
      # --- ---

      - name: ✅ Deployment Complete
        run: echo "All Lambda functions deployed successfully!"